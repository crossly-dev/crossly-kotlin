# Build, test and package on every push (any branch) and pull request.
#
# Managed by tools/sdk-repo/seed.mjs in the Crossly monorepo: edits here are overwritten on the next seed.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: build seller
        run: bash codegen/ci/check.sh kotlin seller
      - name: build buyer
        run: bash codegen/ci/check.sh kotlin buyer
      - name: webhook conformance vectors
        working-directory: codegen/integrations/webhooks/kotlin
        run: bash check-vectors.sh
      - name: package
        run: |
          bash codegen/integrations/extras/kotlin/package.sh
